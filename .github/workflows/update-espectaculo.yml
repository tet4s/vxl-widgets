name: Actualizar agenda de espectáculos

# Raspa las agendas públicas (Santa Fe y Eventbrite) y publica
# data/espectaculo-raspados.json, que consumen el widget de agenda y la página
# de espectáculos. Los eventos pagos no pasan por acá: se cargan en WordPress.

on:
  schedule:
    # 08:00 y 18:00 hora Argentina (UTC-3). Las agendas cambian poco durante el día.
    - cron: '0 11,21 * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'data/espectaculo-raspados.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: espectaculo
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Solo para corridas por push: si el JSON tiene menos de 4 horas, no corre.
      - name: ¿Datos frescos?
        id: frescura
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node -e '
            const fs=require("fs");
            let t=0;
            try { t=Date.parse(JSON.parse(fs.readFileSync("data/espectaculo-raspados.json","utf8")).generado)||0; } catch(e){}
            const min=(Date.now()-t)/60000;
            const skip=t>0 && min<240;
            console.log("Última corrida hace "+Math.round(min)+" min → "+(skip?"se saltea":"se ejecuta"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT,"skip="+skip+"\n");
          '

      - name: Raspar agendas
        if: steps.frescura.outputs.skip != 'true'
        run: node scripts/espectaculo/index.js

      - name: Commit y push
        if: steps.frescura.outputs.skip != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/espectaculo-raspados.json
          git diff-index --quiet HEAD || git commit -m 'Auto-update: agenda de espectáculos [skip ci]'
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push && break
            sleep 5
          done
