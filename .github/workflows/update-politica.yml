name: Actualizar Política del Litoral

on:
  # Solo manual. El disparo automático vive en datos.yml (un solo workflow
  # por push/cron) para no lanzar 7 corridas a la vez en cada push.
  workflow_dispatch:
# Evita que dos corridas se pisen escribiendo data/politica.json
concurrency:
  # Los tres scrapers comparten grupo: nunca llaman a Gemini al mismo tiempo.
  # Cada request espera 60.000/GEMINI_RPM ms (5 RPM por defecto).
  group: gemini
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Tope duro: si una fuente se cuelga, el run muere y el JSON anterior queda intacto.
    timeout-minutes: 15

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      # Solo aplica a los runs disparados por push: si data/politica.json se
      # actualizó hace menos de 25 minutos, no vale la pena volver a scrapear.
      - name: ¿Datos frescos?
        id: frescura
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Corrida por ${{ github.event_name }}: se ejecuta siempre."
            exit 0
          fi
          node -e '
            const fs = require("fs");
            let t = 0;
            try { t = Date.parse(JSON.parse(fs.readFileSync("data/politica.json","utf8")).last_updated) || 0; } catch (e) {}
            const min = (Date.now() - t) / 60000;
            const skip = t > 0 && min < 25;
            console.log("Última actualización hace " + Math.round(min) + " min → " + (skip ? "se saltea" : "se ejecuta"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "skip=" + skip + "\n");
          '

      - name: Configurar Node.js (v24)
        if: steps.frescura.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar Dependencias
        if: steps.frescura.outputs.skip != 'true'
        run: npm install

      - name: Ejecutar Update de Política
        if: steps.frescura.outputs.skip != 'true'
        run: node scripts/update-politica.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_RPM: '5'

      - name: Commit y Push de Datos Actualizados
        if: steps.frescura.outputs.skip != 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/politica.json
          git diff-index --quiet HEAD || git commit -m "chore(data): actualización automática de política [skip ci]"
          # Otros workflows commitean al mismo tiempo: reintentar el push con rebase
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push && break
            sleep 5
          done