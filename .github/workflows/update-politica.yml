name: Actualizar Política del Litoral

on:
  schedule:
    # Cada 20 minutos, todo el día: las notificaciones de política no tienen horario
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar Dependencias
        run: npm install

      - name: Ejecutar Update de Política
        run: node scripts/update-politica.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit y Push de Datos Actualizados
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/politica.json
          git diff-index --quiet HEAD || git commit -m "chore(data): actualización automática de política [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push && break
            sleep 5
          done