name: Actualizador de Bolsillo VXL

on:
  schedule:
    - cron: '*/10 * * * *' # Cada 10 minutos
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bolsillo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar script de bolsillo
        run: node ./scripts/update-bolsillo.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit y Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ./data/bolsillo.json
          git diff-index --quiet HEAD || (git commit -m 'Auto-update: bolsillo noticias [skip ci]' && (git push || (git pull --rebase && git push)))
