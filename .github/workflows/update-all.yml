name: Actualizar todos los datos VXL

# Botón único de refresco para el operador.
# Corre los siete actualizadores en serie y commitea todo junto, para evitar
# conflictos de push entre workflows. Si un actualizador falla, sigue con el resto.
#
# Cómo usarlo: pestaña Actions > "Actualizar todos los datos VXL" > Run workflow.
# También se puede disparar por API (ver deploy/README.md).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos-todos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Cotizaciones (dólar + bolsa)
        continue-on-error: true
        env:
          IOL_USERNAME: ${{ secrets.IOL_USERNAME }}
          IOL_PASSWORD: ${{ secrets.IOL_PASSWORD }}
          IOL_ACCESS_TOKEN: ${{ secrets.IOL_ACCESS_TOKEN }}
          IOL_REFRESH_TOKEN: ${{ secrets.IOL_REFRESH_TOKEN }}
        run: node ./scripts/update-quotes.js

      - name: Pizarra de granos
        continue-on-error: true
        run: node ./scripts/scraper.js

      - name: Noticias de bolsillo
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node ./scripts/update-bolsillo.js

      - name: Política
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node ./scripts/update-politica.js

      - name: Policiales
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node ./scripts/update-policial.js

      - name: Deportes
        continue-on-error: true
        run: node ./scripts/update-deportes.js

      - name: Tránsito
        continue-on-error: true
        run: node ./scripts/update-transito.js

      - name: Commit y push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff-index --quiet HEAD || git commit -m 'Auto-update: refresco completo de datos [skip ci]'
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push && break
            sleep 5
          done
