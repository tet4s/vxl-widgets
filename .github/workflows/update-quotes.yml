name: Actualizador de Cotizaciones VXL Economía

on:
  # Solo manual. El disparo automático vive en datos.yml (un solo workflow
  # por push/cron) para no lanzar 7 corridas a la vez en cada push.
  workflow_dispatch:

concurrency:
  group: quotes
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Solo para corridas por push: si quotes.json tiene menos de 25 minutos, no corre.
      - name: ¿Datos frescos?
        id: frescura
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node -e '
            const fs=require("fs");
            let t=0;
            try { t=Date.parse(JSON.parse(fs.readFileSync("data/quotes.json","utf8")).last_updated)||0; } catch(e){}
            const min=(Date.now()-t)/60000;
            const skip=t>0 && min<25;
            console.log("Última actualización hace "+Math.round(min)+" min → "+(skip?"se saltea":"se ejecuta"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT,"skip="+skip+"\n");
          '

      - name: Configurar Node.js
        if: steps.frescura.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        if: steps.frescura.outputs.skip != 'true'
        run: npm ci || npm install

      - name: Ejecutar script de actualización
        if: steps.frescura.outputs.skip != 'true'
        env:
          IOL_USERNAME: ${{ secrets.IOL_USERNAME }}
          IOL_PASSWORD: ${{ secrets.IOL_PASSWORD }}
          IOL_ACCESS_TOKEN: ${{ secrets.IOL_ACCESS_TOKEN }}
          IOL_REFRESH_TOKEN: ${{ secrets.IOL_REFRESH_TOKEN }}
        run: node ./scripts/update-quotes.js

      - name: Commit y push
        if: steps.frescura.outputs.skip != 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ./data/quotes.json
          git diff-index --quiet HEAD || git commit -m 'Auto-update: cotizaciones [skip ci]'
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push && break
            sleep 5
          done
