name: Executar Scraper Agrícola en Tiempo Real

on:
  schedule:
    # Se ejecuta cada 30 minutos de Lunes a Viernes de 12:00 a 21:00 UTC (09:00 a 18:00 hora Argentina)
    - cron: '*/30 12-21 * * 1-5'
  workflow_dispatch: # Disparo manual desde GitHub Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar Dependencias
        run: |
          npm init -y
          npm install axios cheerio

      - name: Ejecutar Script Scraper
        run: node scripts/scraper.js

      - name: Commit y Push de Datos Actualizados
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/pizarra.json
          git diff-index --quiet HEAD || git commit -m "chore(data): actualización automática de datos reales [skip ci]"
          git push
