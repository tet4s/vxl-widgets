name: Actualizador de Policiales VXL

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/policial.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Los tres scrapers comparten grupo: nunca llaman a Gemini al mismo tiempo.
  # Cada request espera 60.000/GEMINI_RPM ms (5 RPM por defecto).
  group: gemini
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Solo para corridas por push: si policial.json tiene menos de 25 minutos, no corre.
      - name: ¿Datos frescos?
        id: frescura
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node -e '
            const fs=require("fs");
            let t=0;
            try { t=Date.parse(JSON.parse(fs.readFileSync("data/policial.json","utf8")).last_updated)||0; } catch(e){}
            const min=(Date.now()-t)/60000;
            const skip=t>0 && min<25;
            console.log("Última actualización hace "+Math.round(min)+" min → "+(skip?"se saltea":"se ejecuta"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT,"skip="+skip+"\n");
          '

      - name: Configurar Node.js
        if: steps.frescura.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        if: steps.frescura.outputs.skip != 'true'
        run: npm ci || npm install

      - name: Ejecutar script de policiales
        if: steps.frescura.outputs.skip != 'true'
        run: node ./scripts/update-policial.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_RPM: '5'

      - name: Commit y push
        if: steps.frescura.outputs.skip != 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ./data/policial.json
          git diff-index --quiet HEAD || git commit -m 'Auto-update: noticias policiales [skip ci]'
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push && break
            sleep 5
          done